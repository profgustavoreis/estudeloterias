    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EL1Z05CW52"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Google Consent Mode v2 — default tudo NEGADO (LGPD/ANPD).
      // O CMP (src/components/CookieConsent.tsx) atualiza os sinais via gtag('consent','update').
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });

      // Sem consentimento, o GA envia apenas pings sem cookies e com dados redigidos.
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);

      // Restaura a escolha já salva pelo CMP antes de configurar o GA4.
      // Chave/versão devem ficar em sincronia com src/lib/consent.ts.
      (function () {
        try {
          var raw = window.localStorage.getItem('el_cookie_consent_v1');
          if (!raw) return;
          var saved = JSON.parse(raw);
          if (!saved || saved.version !== 1) return;
          gtag('consent', 'update', {
            analytics_storage: saved.analytics ? 'granted' : 'denied',
            ad_storage: saved.marketing ? 'granted' : 'denied',
            ad_user_data: saved.marketing ? 'granted' : 'denied',
            ad_personalization: saved.marketing ? 'granted' : 'denied'
          });
        } catch (e) { /* storage indisponível: mantém o default negado */ }
      })();

      gtag('js', new Date());

      gtag('config', 'G-EL1Z05CW52');
    </script>
