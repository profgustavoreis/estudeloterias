kind = "api"
# ⚠️ TARGET DE DEV/LEGACY — não é o host de produção.
# Este artefato pertence ao layout original do Replit (hoje dev/legacy). A
# PRODUÇÃO REAL roda em Oracle Cloud Free + aaPanel + Apache: o Apache faz
# proxy reverso de tudo para o api-server (Express) via PORT/FRONTEND_DIST/
# DATABASE_URL gerenciadas no projeto Node do aaPanel.
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/sitemap.xml"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
